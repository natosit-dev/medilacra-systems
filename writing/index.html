<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Writing | Medilacra Systems</title>
    <style>
        body {
            max-width: 760px;
            margin: 40px auto;
            padding: 0 20px;
            font-family: Georgia, serif;
            font-size: 18px;
            line-height: 1.7;
        }
    </style>
</head>
<body>
    <nav><a href="../">Medilacra Systems</a> / Writing</nav>

    <article id="content">Loading from GitHub...</article>

    <hr>
    <a id="source">View original Markdown on GitHub</a>

    <script>
        const repo = "natosit-dev/words_n_stuff";
        const branch = "main";
        const path = "2026/Art_and_Health_Data_Standards_9.13.2026_v1.md";

        const rawUrl =
            `https://raw.githubusercontent.com/${repo}/${branch}/${path}`;

        document.getElementById("source").href =
            `https://github.com/${repo}/blob/${branch}/${path}`;

        function renderInline(parent, text) {
            text.split(/(\*\*.*?\*\*)/g).forEach(part => {
                if (part.startsWith("**") && part.endsWith("**")) {
                    const bold = document.createElement("strong");
                    bold.textContent = part.slice(2, -2);
                    parent.append(bold);
                } else {
                    parent.append(document.createTextNode(part));
                }
            });
        }

        async function loadArticle() {
            const content = document.getElementById("content");

            try {
                const response = await fetch(rawUrl);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const markdown = await response.text();
                content.replaceChildren();

                markdown.trim().split(/\r?\n\s*\r?\n/).forEach(block => {
                    const heading = block.match(/^(#{1,6}) (.*)$/);

                    const element = document.createElement(
                        heading ? `h${heading[1].length}` : "p"
                    );

                    const text = heading ? heading[2] : block;

                    text.split(/\r?\n/).forEach((line, i) => {
                        if (i) element.append(document.createElement("br"));
                        renderInline(element, line.trimEnd());
                    });

                    content.append(element);
                });
            } catch (error) {
                content.textContent =
                    `Unable to retrieve article: ${error.message}`;
            }
        }

        loadArticle();
    </script>
</body>
</html>
